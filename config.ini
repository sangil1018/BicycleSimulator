[Settings]
; 하드웨어 연결 포트 (예: COM3, /dev/ttyUSB0)
PortName=COM8
; 시리얼 통신 속도
BaudRate=115200
; 주행 기준 속도 (km/h) - 영상 1.0배속 기준
BaseSpeedKph=15.0
; 로고 표시 여부 (1=표시, 0=숨김)
logo=1

[Camera]
; 핸들 최대 조향각 출력 범위 (도, 1~45) — 하드웨어 최대값(±45°)을 이 값으로 리매핑
SteeringRange=45
; 조향 회전 스무딩 시간 (초, 작을수록 빠르게 반응)
CameraSteerSmoothTime=0.12

[UI]
; 노란색 속도 경고 기준값 (km/h)
YellowThreshold=20.0
; 빨간색 속도 경고 기준값 (km/h)
RedThreshold=30.0
