[Settings]
; 스테이션 ID
StationID=1
; ESP32-S3 연결 포트 (센서 전용, 진동은 별도 USB 릴레이 사용)
PortName=COM8
; ESP32-S3 시리얼 통신 속도
BaudRate=115200
; 주행 기준 속도 (km/h) - 영상 1.0배속 기준
BaseSpeedKph=15.0
; 페달 1바퀴(1회전)당 이동 거리 (m) — 케이던스(RPM)→속도(km/h) 환산에 사용
MetersPerRevolution=1.5
; 주행 기준 속도 대비 영상 재생 배속 (1.0=기준속도, 2.0=2배속)
PlaybackMultiplier=1.0
; 영상 최대 재생 배속 (아무리 빨리 페달을 밟아도 이 배속을 넘지 않음)
MaxRate=1.5
; 진동 패턴 시간 배율 (1.0=기본, 1.5=1.5배 길게, 범위 0.5~3.0)
VibeMultiplier=1.0
; 브레이크 작동 시 완전 정지까지 걸리는 시간 (초, 범위 0.05~10)
BrakeStopDuration=0.5
; 디버그 정보 표시 여부 (1=표시, 0=숨김) — 빌드에서도 적용
debugMode=1
; 목표 프레임레이트 (범위 15~240, 0=제한 없음)
fps=60
; 로고 표시 여부 (1=표시, 0=숨김)
logo=1

[Vibration]
; 진동 사용 여부 (1=활성화, 0=비활성화)
isActive=1
; 진동 릴레이 연결 포트 (USB 릴레이, ESP32와 별도)
RelayPortName=COM9
; 진동 릴레이 시리얼 통신 속도
RelayBaudRate=9600
; 짧은 진동 지속시간 (초)
VibeShortDuration=0.2
; 중간 진동 지속시간 (초)
VibeMediumDuration=0.5
; 긴 진동 지속시간 (초)
VibeLongDuration=1.5

[Camera]
; 핸들 최대 조향각 출력 범위 (도, 1~45) — 하드웨어 최대값(±45°)을 이 값으로 리매핑
SteeringRange=45
; 조향 회전 스무딩 시간 (초, 작을수록 빠르게 반응)
CameraSteerSmoothTime=0.12

[UI]
; 노란색 속도 경고 기준값 (km/h)
YellowThreshold=20.0
; 빨간색 속도 경고 기준값 (km/h)
RedThreshold=30.0
