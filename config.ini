[Settings]
; 스테이션 ID
StationID=1
; ESP32-S3 연결 포트 (센서 + 진동 — Unity가 쓰는 유일한 포트)
PortName=COM8
; ESP32-S3 시리얼 통신 속도
BaudRate=115200
; 주행 기준 속도 (km/h) - 영상 1.0배속 기준
BaseSpeedKph=15.0
; 페달 1바퀴(1회전)당 이동 거리 (m) — 케이던스(RPM)→속도(km/h) 환산에 사용
MetersPerRevolution=1.0
; 주행 기준 속도 대비 영상 재생 배속 (1.0=기준속도, 2.0=2배속)
PlaybackMultiplier=1.0
; 영상 최대 재생 배속 (아무리 빨리 페달을 밟아도 이 배속을 넘지 않음)
MaxRate=3.0
; 진동 패턴 시간 배율 (1.0=기본, 1.5=1.5배 길게, 범위 0.5~3.0)
; 진동 길이를 조절하는 유일한 키 — 연결 시 P 명령으로 ESP32 시퀀서에 전달된다
VibeMultiplier=1.0
; 브레이크 작동 시 완전 정지까지 걸리는 시간 (초, 범위 0.05~10)
BrakeStopDuration=0.3
; 페달을 멈췄을 때 관성으로 완전 정지까지 걸리는 시간 (초, 범위 0.05~5)
; 값이 클수록 더 부드럽게 굴러가다 선다. 0.3~0.5 권장.
; (펌웨어는 마지막 페달 펄스 후 0.5초가 지나야 정지로 판단하므로, 실제 체감 지연은 이 값 + 0.5초)
CoastStopDuration=0.5
; 브레이크 극성 반전 (0=기본, 1=반전)
; 브레이크를 잡지 않았는데 계속 제동 상태(디버그 화면의 Brake가 True 고정)라면 1로 바꾼다.
; 제동 중에는 페달·키보드 입력이 모두 무시되므로, 극성이 뒤집혀 있으면 아무것도 움직이지 않는다.
; 스위치를 normally-open ↔ normally-closed로 교체했을 때 펌웨어 재플래싱 없이 여기서 교정한다.
BrakeInverted=0
; 디버그 정보 표시 여부 (1=표시, 0=숨김) — 빌드에서도 적용
debugMode=0
; 목표 프레임레이트 (범위 15~240, 0=제한 없음)
fps=60
; 로고 표시 여부 (1=표시, 0=숨김)
logo=1

[Vibration]
; 진동은 ESP32-S3가 GPIO2(2번핀)로 직접 구동한다.
;   ESP32 GPIO2 → MOSFET 광커플러 절연 드라이버 모듈 SIG, GND 공통.
; 진동 패턴/길이는 펌웨어의 시퀀서가 결정하며, Unity는 패턴 번호(V0~V6)만 보낸다.
; USB 릴레이 진동은 더 이상 사용하지 않는다 (아래 Relay*/Vibe*Duration 키는 무시됨).

; 진동 사용 여부 (1=활성화, 0=비활성화)
isActive=1
; 진동 길이 조절은 위쪽 [Game]의 VibeMultiplier로 한다 (연결 시 P 명령으로 펌웨어에 전달)

; ── 아래는 폐기된 USB 릴레이 설정 (읽어도 동작에 영향 없음) ──
;RelayPortName=COM9
;RelayBaudRate=9600
;VibeShortDuration=0.2
;VibeMediumDuration=0.5
;VibeLongDuration=1.5

[Camera]
; 핸들 최대 조향각 출력 범위 (도, 1~45) — 하드웨어 최대값(±45°)을 이 값으로 리매핑
SteeringRange=45
; 조향 회전 스무딩 시간 (초, 작을수록 빠르게 반응)
CameraSteerSmoothTime=0.12

[UI]
; 노란색 속도 경고 기준값 (km/h)
YellowThreshold=16.0
; 빨간색 속도 경고 기준값 (km/h)
RedThreshold=25.0