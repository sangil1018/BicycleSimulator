<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg">
<title>ESP32-S3 전체 연결도 v5.8 — 광커플러 절연 MOSFET</title>
<defs>
  <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0002"/></filter>
