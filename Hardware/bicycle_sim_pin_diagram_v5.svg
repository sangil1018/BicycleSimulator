<circle cx="480" cy="156" r="3" fill="#BDC3C7"/><text font-family="Arial" font-size="7.5" fill="#BDC3C7" x="487" y="159" dominant-baseline="central">IO44 RX</text>
<circle cx="480" cy="178" r="5" fill="#F39C12"/>
<text font-family="Arial" font-size="8" font-weight="bold" fill="#D68910" x="487" y="181" dominant-baseline="central">IO1</text>
