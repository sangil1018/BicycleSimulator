<text font-family="Arial" font-size="9.5" fill="#8EBBDD" x="460" y="37" text-anchor="middle">PAS 12자석 · ICM-20948 DMP Roll · 광커플러 절연 MOSFET 진동드라이버 · 브레이크 ×1 · 버튼 ×2</text>

