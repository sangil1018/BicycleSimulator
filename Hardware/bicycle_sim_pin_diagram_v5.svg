<path d="M480 178 L516 178" fill="none" stroke="#F39C12" stroke-width="2"/>
<text font-family="Arial" font-size="8" fill="#D68910" x="520" y="181" dominant-baseline="central">← PAS 파란선 (크랭크)</text>

<!-- ====================================================== 광커플러 절연 MOSFET 모듈 ====================================================== -->
<!-- 큰 박스: 절연 경계 표현 -->
<rect x="536" y="196" width="330" height="150" rx="8" fill="#F0F7F0" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#sh)"/>
<text font-family="Arial" font-size="9" font-weight="bold" fill="#1A7A45" x="701" y="210" text-anchor="middle">광커플러 절연 MOSFET 모듈  (3-20V)</text>

<!-- 절연 구분선 -->
<line x1="701" y1="220" x2="701" y2="338" stroke="#27AE60" stroke-width="1" stroke-dasharray="3 2"/>
<text font-family="Arial" font-size="7.5" fill="#27AE60" x="620" y="228" text-anchor="middle">◀ 입력측 (ESP32) ▶</text>
<text font-family="Arial" font-size="7.5" fill="#27AE60" x="785" y="228" text-anchor="middle">◀ 출력측 (모터) ▶</text>

<!-- 입력측 박스 -->
<rect x="548" y="238" width="140" height="94" rx="6" fill="#EBF5FB" stroke="#2980B9" stroke-width="1"/>
<text font-family="Arial" font-size="9" font-weight="bold" fill="#1A5276" x="618" y="254" text-anchor="middle">입력 (Signal)</text>
<text font-family="Arial" font-size="8.5" font-weight="bold" fill="#9B59B6" x="556" y="274">PWM+ ← IO2</text>
<text font-family="Arial" font-size="8.5" fill="#7F8C8D" x="556" y="290">GND  ← ESP32 GND</text>
<text font-family="Arial" font-size="8" fill="#2980B9" x="556" y="310">신호 3~20V 지원</text>
<text font-family="Arial" font-size="8" fill="#2980B9" x="556" y="324">→ 3.3V 직결 OK</text>

<!-- 출력측 박스 -->
<rect x="714" y="238" width="140" height="94" rx="6" fill="#FEF5E7" stroke="#E67E22" stroke-width="1"/>
<text font-family="Arial" font-size="9" font-weight="bold" fill="#7D3500" x="784" y="254" text-anchor="middle">출력 (Load)</text>
<text font-family="Arial" font-size="8.5" fill="#C0392B" x="722" y="274">DC+ ← 벽충전기 5V+</text>
<text font-family="Arial" font-size="8.5" fill="#7F8C8D" x="722" y="290">DC− ← 벽충전기 5V−</text>
<text font-family="Arial" font-size="8.5" font-weight="bold" fill="#CA6F1E" x="722" y="310">OUT → 진동모터</text>
<text font-family="Arial" font-size="8" fill="#A04000" x="722" y="324">MOSFET 내장 스위칭</text>

<!-- IO2 → PWM+ -->
<path d="M480 200 L512 200 L512 268 L548 268" fill="none" stroke="#9B59B6" stroke-width="2"/>
<text font-family="Arial" font-size="7.5" fill="#9B59B6" x="516" y="235" writing-mode="tb">PWM</text>

<!-- 진동모터 -->
<rect x="700" y="360" width="120" height="60" rx="6" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.2" filter="url(#sh)"/>
<text font-family="Arial" font-size="11" font-weight="bold" fill="#7D3500" x="760" y="384" text-anchor="middle">진동모터</text>
<text font-family="Arial" font-size="9" fill="#CA6F1E" x="760" y="400" text-anchor="middle">ERM 5V (핸들바)</text>
<!-- OUT → 모터 -->
<path d="M784 332 L784 360" fill="none" stroke="#E67E22" stroke-width="2"/>

<!-- 벽 충전기 -->
<rect x="536" y="360" width="150" height="76" rx="8" fill="#FFF8E1" stroke="#F39C12" stroke-width="1.5" filter="url(#sh)"/>
<rect x="544" y="366" width="134" height="18" rx="4" fill="#E59A00"/>
<text font-family="Arial" font-size="9.5" font-weight="bold" fill="#FFF" x="611" y="375" text-anchor="middle" dominant-baseline="central">⚡ 벽 충전기 5V 2A</text>
<text font-family="Arial" font-size="8.5" font-weight="bold" fill="#C0392B" x="611" y="398" text-anchor="middle">PC와 완전 분리</text>
<text font-family="Arial" font-size="8" fill="#7D6000" x="611" y="414" text-anchor="middle">5V+ → 모듈 DC+</text>
<text font-family="Arial" font-size="8" fill="#7D6000" x="611" y="427" text-anchor="middle">5V− → 모듈 DC−</text>
<!-- 충전기 → 출력측 DC -->
<path d="M660 360 L660 340 L730 340 L730 332" fill="none" stroke="#E59A00" stroke-width="2"/>

<!-- 절연 강조 배너 -->
<rect x="536" y="450" width="330" height="72" rx="8" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.2"/>
<rect x="544" y="456" width="314" height="18" rx="4" fill="#1A7A45"/>
<text font-family="Arial" font-size="9" font-weight="bold" fill="#FFF" x="701" y="465" text-anchor="middle" dominant-baseline="central">★ 광커플러 절연 = 먹통 차단 핵심</text>
<text font-family="Arial" font-size="8.5" fill="#1A5276" x="550" y="488">입력측 GND (ESP32) ⊘ 출력측 GND (충전기)</text>
<text font-family="Arial" font-size="8.5" font-weight="bold" fill="#C0392B" x="550" y="504">두 GND를 연결하지 말 것 → 절연 유지</text>
<text font-family="Arial" font-size="8" fill="#7F8C8D" x="550" y="517">모터 노이즈가 ESP32로 넘어올 경로 자체가 없음</text>

<!-- 연결 요약 -->
<rect x="38" y="460" width="470" height="176" rx="8" fill="#F8F9FA" stroke="#CED4DA" stroke-width="1"/>
<rect x="46" y="466" width="454" height="20" rx="4" fill="#2C3E50"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#FFF" x="273" y="476" text-anchor="middle" dominant-baseline="central">전체 배선 요약</text>

<text font-family="Arial" font-size="9" fill="#1A1A1A" x="54" y="502">PAS 센서    빨강→3V3  노랑→GND  파랑→IO1</text>
<text font-family="Arial" font-size="9" fill="#1A1A1A" x="54" y="520">ICM-20948   VCC→3V3  GND→GND  SDA→IO17  SCL→IO18  AD0→3V3</text>
<text font-family="Arial" font-size="9" fill="#1A1A1A" x="54" y="538">브레이크    IO4 + GND    (1개)</text>
<text font-family="Arial" font-size="9" fill="#1A1A1A" x="54" y="556">O / X 버튼  IO6 / IO7 + GND</text>
<text font-family="Arial" font-size="9" fill="#9B59B6" x="54" y="574">진동모듈    PWM+→IO2  입력GND→ESP32 GND</text>
<text font-family="Arial" font-size="9" fill="#E67E22" x="54" y="592">진동전원    DC+/−→벽충전기 5V   OUT→진동모터</text>
<text font-family="Arial" font-size="9" fill="#2980B9" x="54" y="610">ESP32       USB-C → PC (시리얼+전원)</text>
<text font-family="Arial" font-size="8.5" fill="#C0392B" x="54" y="627">★ 입력측·출력측 GND 분리 유지 (절연) | 펌웨어 v5.6 변경 없음</text>

<!-- 하단 -->
<rect x="38" y="648" width="828" height="20" rx="4" fill="#EAFAF1" stroke="#27AE60" stroke-width="0.7"/>
<text font-family="Arial" font-size="9" fill="#1A7A45" x="452" y="658" text-anchor="middle" dominant-baseline="central">v5.8: 광커플러 절연 MOSFET 모듈(3-20V) 채택 | 입력-출력 접지 분리 | 모터전원 벽충전기 | IRF520·릴레이 제거 | IO2 PWM 그대로</text>

</svg>
