<circle cx="480" cy="222" r="3" fill="#D5D8DC"/><text font-family="Arial" font-size="7.5" fill="#BDC3C7" x="487" y="225" dominant-baseline="central">IO42 (미사용)</text>
<circle cx="480" cy="244" r="3" fill="#BDC3C7"/><text font-family="Arial" font-size="7.5" fill="#BDC3C7" x="487" y="247" dominant-baseline="central">IO41</text>
<circle cx="480" cy="266" r="3" fill="#BDC3C7"/><text font-family="Arial" font-size="7.5" fill="#BDC3C7" x="487" y="269" dominant-baseline="central">IO40~35</text>
<circle cx="480" cy="388" r="3" fill="#E67E22" stroke="#CA6F1E" stroke-width="0.6"/>
<text font-family="Arial" font-size="7.5" fill="#E67E22" x="487" y="391" dominant-baseline="central">IO0 ⚠BOOT</text>
<circle cx="480" cy="432" r="4" fill="#2ECC71"/>
<text font-family="Arial" font-size="7.5" fill="#27AE60" x="487" y="435" dominant-baseline="central">IO48 RGB 내장</text>
<circle cx="480" cy="556" r="5" fill="#7F8C8D"/>
<text font-family="Arial" font-size="8" font-weight="bold" fill="#7F8C8D" x="487" y="559" dominant-baseline="central">GND</text>
<circle cx="480" cy="578" r="5" fill="#7F8C8D"/>
<text font-family="Arial" font-size="8" font-weight="bold" fill="#7F8C8D" x="487" y="581" dominant-baseline="central">GND</text>

<!-- ====================================================== 왼쪽 컴포넌트 ====================================================== -->
<rect x="38" y="105" width="212" height="18" rx="4" fill="#FEE5E5" stroke="#E74C3C" stroke-width="0.8"/>
<text font-family="Arial" font-size="9" font-weight="bold" fill="#C0392B" x="144" y="114" text-anchor="middle" dominant-baseline="central">3.3V  →  PAS · ICM-20948</text>
<line x1="250" y1="112" x2="300" y2="112" stroke="#E74C3C" stroke-width="2"/>
<line x1="250" y1="134" x2="300" y2="134" stroke="#E74C3C" stroke-width="2"/>

<text font-family="Arial" font-size="8" fill="#7F8C8D" x="244" y="581" text-anchor="end" dominant-baseline="central">⏚ 신호 GND</text>
<line x1="246" y1="578" x2="300" y2="578" stroke="#7F8C8D" stroke-width="1.5"/>

<!-- 브레이크 IO4 -->
<rect x="38" y="169" width="212" height="22" rx="5" fill="#EAFAF1" stroke="#27AE60" stroke-width="1" filter="url(#sh)"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#1A7A45" x="144" y="180" text-anchor="middle" dominant-baseline="central">브레이크 스위치 ×1</text>
<line x1="250" y1="178" x2="300" y2="178" stroke="#27AE60" stroke-width="2"/>
<text font-family="Arial" font-size="7.5" fill="#7F8C8D" x="144" y="198" text-anchor="middle">반대 단자 → GND</text>

<!-- O 버튼 IO6 -->
<rect x="38" y="213" width="212" height="22" rx="5" fill="#E8F8F5" stroke="#1ABC9C" stroke-width="1" filter="url(#sh)"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#138D75" x="144" y="224" text-anchor="middle" dominant-baseline="central">O 버튼 (신호)</text>
<line x1="250" y1="222" x2="300" y2="222" stroke="#1ABC9C" stroke-width="2"/>

<!-- X 버튼 IO7 -->
<rect x="38" y="235" width="212" height="22" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1" filter="url(#sh)"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#C0392B" x="144" y="246" text-anchor="middle" dominant-baseline="central">X 버튼 (신호)</text>
<line x1="250" y1="244" x2="300" y2="244" stroke="#E74C3C" stroke-width="2"/>

<text font-family="Arial" font-size="7.5" fill="#AABBCC" x="42" y="264">※ 버튼 반대 단자 → GND / LED 미결선</text>

<!-- ICM-20948 -->
<rect x="38" y="278" width="212" height="94" rx="7" fill="#EBF5FB" stroke="#2980B9" stroke-width="1.2" filter="url(#sh)"/>
<rect x="46" y="284" width="196" height="20" rx="4" fill="#2471A3"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#FFF" x="144" y="294" text-anchor="middle" dominant-baseline="central">ICM-20948  DMP Roll 조향</text>
<text font-family="Arial" font-size="8.5" fill="#1A5276" x="48" y="314">VCC → 3V3   GND → GND</text>
<text font-family="Arial" font-size="8.5" fill="#2980B9" x="48" y="328">SDA → IO17</text>
<text font-family="Arial" font-size="8.5" fill="#8E44AD" x="132" y="328">SCL → IO18</text>
<text font-family="Arial" font-size="8.5" fill="#C0392B" x="48" y="342">AD0 → 3V3  (주소 0x69)</text>
<rect x="46" y="348" width="196" height="18" rx="3" fill="#D6EAF8"/>
<text font-family="Arial" font-size="8" fill="#1A5276" x="144" y="357" text-anchor="middle" dominant-baseline="central">핸들바 케이블타이 고정 | 축선 불필요</text>
<line x1="250" y1="310" x2="300" y2="310" stroke="#2980B9" stroke-width="2"/>
<line x1="250" y1="332" x2="300" y2="332" stroke="#8E44AD" stroke-width="2"/>

<!-- PAS -->
<rect x="38" y="386" width="212" height="56" rx="6" fill="#FEF9E7" stroke="#F39C12" stroke-width="0.9" filter="url(#sh)"/>
<text font-family="Arial" font-size="10" font-weight="bold" fill="#784212" x="144" y="404" text-anchor="middle">PAS 페달 센서 (12자석)</text>
<text font-family="Arial" font-size="8.5" fill="#7D6000" x="46" y="420">빨간→3V3  노랑→GND  파랑→IO1</text>
<text font-family="Arial" font-size="8" fill="#9B7800" x="144" y="434" text-anchor="middle">12 PPR  |  60 RPM = 15 km/h</text>

